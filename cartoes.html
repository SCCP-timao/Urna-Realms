<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Títulos de eleitor</title>
<style>
:root{color-scheme:light dark;--bg:#eef0f4;--ink:#111;--card:#fff;--bt:#0b4f8a;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#14151a;--ink:#eee;--card:#22242c}}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
h1{font-size:19px;margin:4px 0 6px}
.nota{font-size:13px;opacity:.75;margin-bottom:12px}
.msg{color:#c00;font-weight:bold;margin:8px 0}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:12px}
.item{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 2px 8px #0002}
.flip{perspective:900px;cursor:pointer}
.in{position:relative;width:100%;aspect-ratio:900/560;transition:transform .7s;transform-style:preserve-3d}
.flip.v .in{transform:rotateY(180deg)}
.in canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.in canvas.t{transform:rotateY(180deg)}
.nm{font-weight:bold;margin:10px 0 4px}
.dica{font-size:12px;opacity:.65;margin-bottom:8px}
button{background:var(--bt);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:bold;cursor:pointer}
button.s{background:#555}
</style>
</head>
<body>
<h1>Títulos de eleitor (simulados)</h1>
<div class="nota">Acesso restrito. Toque no título para virar frente e verso e baixe o PNG de cada eleitor.</div>
<button id="en">Entrar</button> <button id="td" class="s" style="display:none">Baixar todos</button>
<div id="ms" class="msg"></div>
<div class="lista" id="ls"></div>
<script src="/cartao.js"></script>
<script>
let senha = "", dados = [];

function mostra(){
  const ls = document.getElementById("ls"); ls.innerHTML = "";
  dados.forEach(d => {
    const it = document.createElement("div"); it.className = "item";
    it.innerHTML = '<div class="flip"><div class="in"><canvas class="f"></canvas><canvas class="t"></canvas></div></div><div class="nm"></div><div class="dica">Toque no título para virar</div>';
    frente(it.querySelector(".f"), d.nome, d.numero); verso(it.querySelector(".t"), d.nome, d.numero, d.token);
    it.querySelector(".flip").onclick = e => e.currentTarget.classList.toggle("v");
    it.querySelector(".nm").textContent = d.nome + " · " + d.numero;
    const bt = document.createElement("button"); bt.textContent = "Baixar PNG"; bt.onclick = () => baixar(d);
    it.appendChild(bt); ls.appendChild(it);
  });
  document.getElementById("td").style.display = "inline-block";
}

async function entrar(){
  senha = prompt("Senha de acesso:") || ""; if(!senha) return;
  const ms = document.getElementById("ms"); ms.textContent = "Carregando...";
  try{
    const r = await fetch("/api/cartoes", {headers:{"x-admin-key":senha}, cache:"no-store"});
    if(!r.ok){ ms.textContent = r.status === 401 ? "Senha incorreta." : "Erro ao carregar (HTTP " + r.status + ")."; return; }
    dados = (await r.json()).titulos; ms.textContent = ""; mostra();
  }catch(e){ ms.textContent = "Sem conexão."; }
}
document.getElementById("en").onclick = entrar;
document.getElementById("td").onclick = async () => { for(const d of dados){ baixar(d); await new Promise(r => setTimeout(r, 600)); } };
</script>
</body>
</html>
