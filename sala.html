<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Seção de votação</title>
<style>
:root{color-scheme:light dark;--bg:#eef0f4;--ink:#111;--card:#fff;--muted:#667;--verde:#1a7f37;--seg:#d4d8e0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#14151a;--ink:#eee;--card:#22242c;--muted:#a0a4ae;--seg:#3a3d48}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:10px 14px 18px}
.w{width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px}
.topo{display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}
.pular{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;padding:10px 4px;cursor:pointer}
.passos{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.passos li{flex:1;height:5px;border-radius:9px;background:var(--seg);transition:background .4s}
.passos li.on{background:var(--verde)}
.etapa{font-size:13px;color:var(--muted);margin:-4px 0 0}
.stage{position:relative;width:min(100%,calc(58vh*.714));width:min(100%,calc(58dvh*.714));aspect-ratio:400/560;margin:0 auto;border-radius:18px;overflow:hidden;background:#e6e9d2;box-shadow:0 4px 18px #0003}
.cena{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .5s;pointer-events:none}
.cena.on{opacity:1}
.fala{background:var(--card);border-radius:14px;padding:12px 14px;min-height:104px}
.quem{font-size:12px;font-weight:bold;color:var(--muted);margin:0 0 4px}
.txt{font-size:18px;line-height:1.35;margin:0}
.go{border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:bold;background:var(--verde);color:#fff;cursor:pointer;width:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.go:disabled{opacity:.6}
.go.off{visibility:hidden}
.go:focus-visible,.pular:focus-visible{outline:3px solid #0071e3;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.branco{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .9s;z-index:9}
.branco.on{opacity:1}

/* peças animadas dentro das cenas */
.mv{transition:transform var(--d,.6s) cubic-bezier(.3,.7,.3,1),opacity var(--d,.6s) ease}
.cabeca{transform-box:view-box;transform-origin:200px 215px}
.lid{transform-box:fill-box;transform-origin:center top;animation:pisca 5s infinite}
@keyframes pisca{0%,95%,100%{transform:scaleY(0)}97%{transform:scaleY(1)}}
.scan{opacity:0}
.scan.on{opacity:.9;animation:varre .9s ease-in-out infinite alternate}
@keyframes varre{from{transform:translateY(-26px)}to{transform:translateY(26px)}}
@media (prefers-reduced-motion:reduce){.mv,.cena,.branco,.passos li{transition:none}.lid,.scan.on{animation:none}}
</style>
</head>
<body>
<div class="w">
  <div class="topo">
    <h1>Seção 0001 · Votação simulada</h1>
    <button class="pular" id="pular" type="button">Pular</button>
  </div>
  <ol class="passos" id="passos" aria-label="Etapas do circuito"><li></li><li></li><li></li><li></li></ol>
  <p class="etapa" id="etapa"></p>
  <div class="stage" id="stage" role="img" aria-label="Sala de votação"></div>
  <div class="fala">
    <p class="quem" id="quem"></p>
    <p class="txt" id="txt" aria-hidden="true"></p>
  </div>
  <button class="go off" id="go" type="button"></button>
</div>
<div class="sr" id="sr" role="status" aria-live="polite"></div>
<div class="branco" id="branco"></div>

/* ============ lógica do circuito ============ */
const $ = id => document.getElementById(id);
const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const dorme = ms => new Promise(r => setTimeout(r, RM ? Math.min(ms, 40) : ms));
const NOMES_CENA = {A:"Sala de votação, com a mesa do mesário ao fundo", B:"Mesa do mesário", C:"Corredor até a cabine de votação", D:"Cabine de votação"};
const ETAPAS = ["Sala","Mesa do mesário","Cabine","Urna"];
let token = null, nomeEleitor = "";
try{ token = sessionStorage.getItem("titulo"); }catch(e){}

async function api(rota, metodo, corpo){
  try{
    const r = await fetch("/api/" + rota, {method:metodo, headers:{"Content-Type":"application/json"}, body: corpo ? JSON.stringify(corpo) : undefined});
    let j = {}; try{ j = await r.json(); }catch(e){}
    return Object.assign({ok:r.ok, status:r.status}, j);
  }catch(e){ return {ok:false, status:0, erro:"rede"}; }
}

// sons discretos (passos e carimbo)
let ac;
function bate(freq, dur, vol){
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = "sine"; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, freq / 2), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);
  }catch(e){}
}

function bonito(n){
  const peq = ["da","de","do","das","dos","e"];
  return String(n || "").toLowerCase().split(" ").map((p, i) => (i && peq.includes(p)) ? p : p.charAt(0).toUpperCase() + p.slice(1)).join(" ");
}

function cena(k){
  ["A","B","C","D"].forEach(x => $("c" + x).classList.toggle("on", x === k));
  $("stage").setAttribute("aria-label", NOMES_CENA[k]);
}
function passo(i){
  [...$("passos").children].forEach((li, n) => li.classList.toggle("on", n <= i));
  $("etapa").textContent = "Etapa " + (i + 1) + " de 4 · " + ETAPAS[i];
}

// move uma peça do desenho (transição CSS) e espera terminar
function mover(el, transform, ms, opacidade){
  el.style.setProperty("--d", (RM ? 0 : ms) + "ms");
  if(transform !== null) el.style.transform = transform;
  if(opacidade !== undefined) el.style.opacity = opacidade;
  if(el.id === "cortE"){ // a cortina da direita abre e fecha junto com a da esquerda
    const d = $("cortD"); d.style.setProperty("--d", (RM ? 0 : ms) + "ms");
    d.style.transform = transform === null ? "" : transform.replace("-112", "112");
  }
  return dorme(ms + 30);
}

// boca do mesário
let humor = "neutro";
function boca(e){ ["neutro","aberta","sorriso","triste"].forEach(n => { const el = $("b-" + n); if(el) el.style.display = n === e ? "" : "none"; }); }
function olhar(baixo){ mover($("pupilas"), baixo ? "translateY(3px)" : "translateY(0)", 300); }
function acena(){ mover($("cabeca"), "rotate(5deg)", 220).then(() => mover($("cabeca"), "rotate(-1deg)", 260)).then(() => mover($("cabeca"), "rotate(0deg)", 220)); }

// fala com efeito de digitação
let falaId = 0;
async function fala(quem, texto, comBoca){
  const id = ++falaId, el = $("txt");
  $("quem").textContent = quem; $("sr").textContent = quem + ": " + texto;
  if(RM){ el.textContent = texto; return; }
  el.textContent = "";
  let aberta = false, iv = comBoca ? setInterval(() => { aberta = !aberta; boca(aberta ? "aberta" : humor); }, 130) : null;
  for(let i = 1; i <= texto.length; i++){
