<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carteira do eleitor</title>
<style>
:root{color-scheme:light dark;--bg:#eef0f4;--ink:#111;--card:#fff;--bt:#0b4f8a;--muted:#667;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#14151a;--ink:#eee;--card:#22242c;--muted:#a0a4ae}}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;align-items:center}
.w{width:100%;max-width:460px}
h1{font-size:20px;margin:8px 0 14px;text-align:center}
.aviso{min-height:22px;text-align:center;font-weight:bold;margin:8px 0;color:#1a7f37}
.aviso.e{color:#c00}
.slot{border:3px dashed var(--muted);border-radius:16px;padding:26px 16px;text-align:center;background:var(--card)}
.slot .p{font-size:54px;line-height:1;color:var(--bt);font-weight:bold}
.slot .t{font-size:18px;font-weight:bold;margin:8px 0 16px}
button{border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer;background:var(--bt);color:#fff;width:100%;margin-top:12px}
button.v{background:#1faa3b}button.c{background:#555}
button.l{background:none;color:var(--muted);text-decoration:underline;font-weight:normal;font-size:14px}
button:disabled{opacity:.6}
#cartao{display:none}
.flip{position:relative;perspective:1000px;cursor:pointer}
.in{position:relative;width:100%;aspect-ratio:900/560;transition:transform 1s;transform-style:preserve-3d}
.in.sem{transition:none}
.flip.v .in{transform:rotateY(180deg)}
.in canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;box-shadow:0 4px 14px #0004;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.in canvas.t{transform:rotateY(180deg)}
.selo{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);border:5px solid #c00;color:#c00;background:#fff9;font-size:26px;font-weight:bold;padding:8px 14px;border-radius:10px;pointer-events:none;z-index:5;white-space:nowrap}
.nm{text-align:center;font-weight:bold;margin:14px 0 2px;font-size:18px}
.dica{text-align:center;font-size:12px;color:var(--muted)}
.bu{margin-top:26px;text-align:center}
.bu .b2{background:none;border:1px solid var(--muted);color:var(--ink);width:auto;font-size:13px;padding:6px 10px;font-weight:normal;margin:0}
#bu{display:none;margin-top:8px;background:var(--card);padding:12px;border-radius:8px;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="w">
  <h1>Carteira do eleitor</h1>
  <div id="av" class="aviso"></div>

  <div id="add" class="slot">
    <div class="p">+</div>
    <div class="t">Adicionar seu título de eleitor</div>
    <div class="dica" style="margin-bottom:6px">Envie o arquivo PNG do seu título, sem cortar.</div>
    <input id="arq" type="file" accept="image/*" style="display:none">
    <button id="bad">Escolher o PNG do meu título</button>
  </div>

  <div id="cartao">
    <div class="flip" id="flip">
      <div class="in" id="in"><canvas id="cf"></canvas><canvas id="ct" class="t"></canvas></div>
      <div class="selo" id="selo">VOTO REGISTRADO</div>
    </div>
    <div class="nm" id="nm"></div>
    <div class="dica">Toque no título para virar</div>
    <button id="ir" class="v">CONFIRMAR E IR PARA A URNA</button>
    <button id="tr" class="l">Não é o meu título</button>
  </div>

  <div class="bu"><button id="bbu" class="b2">Boletim de urna</button><div id="bu"></div></div>
</div>
<script src="/cartao.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = "titulo_atual", TOTAL = 28;
let atual = null, chaveAdm = "";

async function api(rota, metodo, corpo, chave){
  try{
    const h = {"Content-Type":"application/json"}; if(chave) h["x-admin-key"] = chave;
    const r = await fetch("/api/"+rota, {method:metodo, headers:h, body: corpo ? JSON.stringify(corpo) : undefined});
    let j = {}; try{ j = await r.json(); }catch(e){}
    return Object.assign({ok:r.ok, status:r.status}, j);
  }catch(e){ return {ok:false, status:0, erro:"rede"}; }
}

function aviso(t, erro){ const a = $("av"); a.textContent = t || ""; a.className = "aviso" + (erro ? " e" : ""); }

function mostra(d, votou, animar){
  atual = d;
  frente($("cf"), d.nome, d.numero); verso($("ct"), d.nome, d.numero, d.token);
  $("nm").textContent = d.nome + " · " + d.numero;
  $("add").style.display = "none"; $("cartao").style.display = "block";
  $("selo").style.display = votou ? "block" : "none";
  $("ir").style.display = votou ? "none" : "block";
  const fl = $("flip"), inn = $("in");
  if(animar){
    inn.classList.add("sem"); fl.classList.add("v"); void inn.offsetWidth; inn.classList.remove("sem");
    setTimeout(() => fl.classList.remove("v"), 80);
  } else fl.classList.remove("v");
}

async function validar(token){
  const r = await api("titulo","POST",{titulo:token});
  $("bad").disabled = false;
  if(r.ok){
    const d = {numero:r.numero, nome:r.nome, token:token};
    try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){}
    aviso(""); mostra(d, false, true);
  } else if(r.erro === "jaVotou") aviso("Este título já votou.", 1);
  else if(r.erro === "invalido") aviso("Título inválido. Use o PNG original.", 1);
  else aviso("Erro de conexão. Tente de novo.", 1);
}

function lerArquivo(f){
  $("bad").disabled = true; aviso("Lendo o título...");
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    URL.revokeObjectURL(url);
    let token = null; try{ token = lerToken(img); }catch(e){}
    if(!token){ $("bad").disabled = false; aviso("Não consegui ler este título. Envie o PNG original, inteiro e sem cortar.", 1); return; }
    validar(token);
  };
  img.onerror = () => { $("bad").disabled = false; aviso("Arquivo inválido. Envie o PNG do título.", 1); };
  img.src = url;
}

$("bad").onclick = () => $("arq").click();
$("arq").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if(f) lerArquivo(f); };
$("flip").onclick = () => $("flip").classList.toggle("v");
$("ir").onclick = () => { try{ sessionStorage.setItem("titulo", atual.token); }catch(e){} location.href = "/urna.html"; };
$("tr").onclick = () => {
  try{ localStorage.removeItem(KEY); }catch(e){}
  atual = null; $("cartao").style.display = "none"; $("add").style.display = "block"; aviso("");
};

async function atualizaBU(){
  const b = $("bu");
  if(!chaveAdm){ chaveAdm = prompt("Senha do mesário:") || ""; if(!chaveAdm){ b.style.display = "none"; return; } }
  b.style.display = "block"; b.textContent = "Carregando...";
  const r = await api("resultados","GET",null,chaveAdm);
  if(!r.ok){ b.textContent = r.status === 401 ? "Senha incorreta." : "Não foi possível carregar o boletim."; chaveAdm = ""; return; }
  const v = r.votos || {}, nomes = {"14":"14 – Rodrigo Miyamura e Silva (Missão)","50":"50 – Miguel Lucas Arruda (PCL)","22":"22 – Lorenzo Bonfa (PL)"};
  let h = "<b>Boletim de urna – Presidente</b><br>";
  ["14","50","22"].forEach(k => h += nomes[k] + ": " + (v[k]||0) + "<br>");
  h += "Brancos: " + (v.branco||0) + "<br>Nulos: " + (v.nulo||0) + "<br>Votaram: " + r.votaram + " de " + TOTAL + "<br><br>" +
       '<button id="zera" class="c" style="margin:0">Zerar urna</button>';
  b.innerHTML = h;
  $("zera").onclick = async () => {
    if(confirm("Zerar todos os votos e liberar os títulos?")){ await api("zerar","POST",{},chaveAdm); atualizaBU(); }
  };
}
$("bbu").onclick = () => { if($("bu").style.display === "block") $("bu").style.display = "none"; else atualizaBU(); };

(async function(){
  const p = new URLSearchParams(location.search);
  let g = null; try{ g = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){}
  if(g && g.numero && g.nome && g.token){
    const r = await api("titulo","POST",{titulo:g.token});
    if(r.ok) mostra(g, false, false);
    else if(r.erro === "jaVotou") mostra(g, true, false);
    else if(r.erro === "invalido"){ try{ localStorage.removeItem(KEY); }catch(e){} }
    else { mostra(g, false, false); aviso("Sem conexão. Tente de novo ao confirmar.", 1); }
  }
  if(p.get("votou")) aviso("Voto registrado! Obrigado por votar.");
  else if(p.get("erro") === "jaVotou") aviso("Este título já votou.", 1);
  if(location.search) history.replaceState(null, "", "/");
})();
</script>
</body>
</html>
